<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skelora Institute Logistics Simulator</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="ship-loader.css">
<meta name="theme-color" content="#0B2A4A">
<style>
  html,body{height:100%;margin:0;background:#0B1220;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .loader{display:flex;flex-direction:column;align-items:center;gap:14px;color:#B9C4D6;}
  noscript{color:#B9C4D6;text-align:center;padding:24px;}
</style>
</head>
<body>
  <div class="loader">
    <div class="ship-loader" aria-hidden="true">
      <svg viewBox="0 0 300 80" preserveAspectRatio="xMidYMid meet">
        <clipPath id="shipWaterClip"><rect x="0" y="0" width="300" height="80"/></clipPath>
        <g clip-path="url(#shipWaterClip)">
          <path class="sl-wave sl-wave1" d="M-50,55 Q-25,45 0,55 T50,55 T100,55 T150,55 T200,55 T250,55 T300,55 T350,55 V80 H-50 Z" fill="#1F6FEB" opacity=".5"/>
          <path class="sl-wave sl-wave2" d="M-50,60 Q-25,52 0,60 T50,60 T100,60 T150,60 T200,60 T250,60 T300,60 T350,60 V80 H-50 Z" fill="#12467D" opacity=".85"/>
          <g class="sl-ship">
            <path d="M-20,44 L46,44 L38,56 L-12,56 Z" fill="#F5820A" stroke="#111318" stroke-width="2" stroke-linejoin="round"/>
            <rect x="0" y="27" width="22" height="17" rx="2" fill="#111318"/>
            <rect x="16" y="17" width="6" height="11" rx="1" fill="#F5820A" stroke="#111318" stroke-width="1"/>
            <text x="11" y="39" font-size="8.5" font-weight="800" fill="#F5820A" text-anchor="middle" font-family="Arial,sans-serif">AS</text>
          </g>
        </g>
      </svg>
    </div>
    <div>Loading Skelora Institute Logistics Simulator…</div>
  </div>
  <noscript>
    This app requires JavaScript. Please enable it, or open
    <a href="intro.html" style="color:#4C8DFF;">intro.html</a> directly.
  </noscript>

  <script src="auth.js"></script>
  <script>
    // Entry point for the whole app (GitHub Pages / any static host looks for
    // this file at the root, and it's what a bare folder double-click opens too).
    // Uses replace() everywhere below so this redirect never becomes an extra
    // back-button stop — pressing back from the dashboard or login screen goes
    // straight to wherever the user actually came from, not bounces through here.
    // A short fixed delay keeps the ship-loader animation visible for at least
    // 3 seconds even though the redirect decision itself is instant.
    (function(){
      var MIN_LOADER_MS = 3000;
      var start = Date.now();
      function go(){
        try{
          var user = (typeof skGetCurrentUser === "function") ? skGetCurrentUser() : null;
          window.location.replace(user ? "skelora-institute-dashboard.html" : "intro.html");
        } catch(e){
          // If anything above ever throws (e.g. corrupted localStorage), fail safe to the intro page.
          window.location.replace("intro.html");
        }
      }
      var elapsed = Date.now() - start;
      setTimeout(go, Math.max(0, MIN_LOADER_MS - elapsed));
    })();
  </script>
</body>
</html>
